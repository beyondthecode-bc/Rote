name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Rote is built with Xcode 27.1 (Swift 6.4). xcode-27 (macOS 27, public preview) is the
    # newest GitHub-hosted macOS image and the only one with Xcode 27; macos-26 and
    # macos-latest stop at Xcode 26. Move to the GA label once GitHub publishes one.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Language check
        run: python3 scripts/check-languages.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: RoteCore tests
        run: swift test --package-path Packages/RoteCore

      - name: RoteAX tests
        run: swift test --package-path Packages/RoteAX

      - name: Generate project
        run: xcodegen generate

      - name: Build and test the app (unsigned)
        run: |
          xcodebuild test -project Rote.xcodeproj -scheme Rote -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO
