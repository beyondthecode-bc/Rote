name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; every push to main keeps its own run and result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Rote is built with Xcode 27.1 (Swift 6.4). xcode-27 (macOS 27, Apple Silicon, generally
    # available since 2026-10-15) is the GitHub-hosted image with Xcode 27; macos-26 and
    # macos-latest stop at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Language check
        run: python3 scripts/check-languages.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: RoteCore tests
        run: swift test --package-path Packages/RoteCore

      - name: RoteAX tests
        run: swift test --package-path Packages/RoteAX

      - name: Generate project
        run: xcodegen generate

      - name: Build and test the app (unsigned)
        run: |
          xcodebuild test -project Rote.xcodeproj -scheme Rote -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO

      # release.sh builds Release; code that reaches a Debug-only symbol outside #if DEBUG fails only here.
      - name: Build the Release configuration (unsigned)
        run: |
          xcodebuild build -project Rote.xcodeproj -scheme Rote -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO
