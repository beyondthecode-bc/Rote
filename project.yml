name: Rote
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30.0"
  groupSortPosition: top

# CODE_SIGN_IDENTITY lives in Config/Signing.xcconfig (ad hoc), which includes the optional, gitignored
# Config/Signing.local.xcconfig. It must stay out of `settings`: project settings override the project's xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.beyondthecode.rote

packages:
  RoteCore:
    path: Packages/RoteCore
  RoteAX:
    path: Packages/RoteAX

targets:
  Rote:
    type: application
    platform: macOS
    sources:
      - path: Rote
      - path: languages
        type: folder
        buildPhase: resources
    dependencies:
      - package: RoteCore
      - package: RoteAX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beyondthecode.rote
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Rote/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rote/App/Rote.entitlements
        PRODUCT_NAME: "Rote"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - RoteTests

  RoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RoteTests
    dependencies:
      - target: Rote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beyondthecode.rote.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rote.app/Contents/MacOS/Rote"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
